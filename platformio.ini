; M5Stack StopWatch(SKU C152、ESP32-S3R8、Flash 16MB / PSRAM 8MB)
; 専用ボード定義が無いので、公式ドキュメントのとおり esp32s3box を借りる。
; https://docs.m5stack.com/en/core/StopWatch の PlatformIO 節が元。
;
;   ビルド      pio run -e m5stack-stopwatch
;   書き込み    pio run -e m5stack-stopwatch -t upload
;   LittleFS    pio run -e m5stack-stopwatch -t uploadfs   (data/ を書く)
;   シリアル    pio device monitor -b 115200
;
; 書き込みに失敗したら、USB を挿したまま電源ボタンを長押し(緑 LED 点滅)で
; ダウンロードモードに入れてからやり直す。

[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino

board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    m5stack/M5Unified @ ^0.3.0
    m5stack/M5GFX @ ^0.3.0
    m5stack/M5PM1 @ ^1.0.7
    m5stack/M5IOE1 @ ^1.0.9
    bblanchon/ArduinoJson @ ^7.4.3
